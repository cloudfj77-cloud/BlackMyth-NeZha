name: 发布版本 Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包游戏
        run: |
          cd site && zip -r "../WhiteMyth-NeZha-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store'
      - name: 提取本版本更新日志
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "版本 ${GITHUB_REF_NAME}" > release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: WhiteMyth-NeZha-${{ github.ref_name }}.zip
